<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ingresar · Guia Pro</title>

  <link rel="stylesheet" href="./styles.css">

  <style>
    .login-page {
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .login-description {
      margin-bottom: 28px;
      color: #64748b;
      line-height: 1.6;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .login-field label {
      font-weight: 600;
    }

    .login-field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      box-sizing: border-box;
    }

    .login-field input:focus {
  outline: 2px solid #2f7d32;
  outline-offset: 2px;
}

.login-submit {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #2f7d32;
  color: white;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.login-submit:hover {
  background: #256b29;
}

.brand {
  color: #2f7d32;
  font-weight: 800;
}

    .login-submit:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .register-professional {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid #e5e7eb;
  text-align: center;
}

.register-professional p {
  margin: 0 0 10px;
  color: #64748b;
  font-size: 14px;
}

.register-professional-link {
  color: #2563eb;
  font-weight: 700;
  text-decoration: none;
}

.register-professional-link:hover {
  text-decoration: underline;
}

    .login-error {
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>

</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

  <a
    href="./index.html"
    class="brand"
  >
    Guia Pro
  </a>

  <nav
    class="main-nav"
    aria-label="Navegación principal"
  >

    <a
      href="./index.html"
      class="main-nav-link"
    >
      Buscar
    </a>

    <a
      href="./professional-login.html"
      class="main-nav-link"
      aria-current="page"
    >
      Soy profesional
    </a>

  </nav>

  <div class="header-location">
    Resistencia, Chaco
  </div>

</div>

  </header>

  <main class="login-page">

<section class="login-card">

  <h1>Ingresá a tu panel</h1>

  <p class="login-description">
    Accedé para gestionar tus trabajos y solicitar
    valoraciones a tus clientes.
  </p>

  <form
    id="professional-login-form"
    class="login-form"
  >

    <div class="login-field">

      <label for="phone">
        Teléfono
      </label>

      <input
        id="phone"
        name="phone"
        type="tel"
        autocomplete="username"
        placeholder="Ej. 3624554433"
        required
      >

    </div>


    <div class="login-field">

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

    </div>


    <p
      id="login-error"
      class="login-error hidden"
      role="alert"
    ></p>


    <button
  id="login-submit"
  class="login-submit"
  type="submit"
>
  Ingresar
</button>

<div class="register-professional">
  <p>¿Todavía no estás registrado?</p>

  <a
    href="./professional-register.html"
    class="register-professional-link"
  >
    Crear mi perfil profesional
  </a>
</div>

  </form>

</section>

  </main>

  <script src="./professional-login.js"></script>

</body>
</html>
